---
apiVersion: "postgresql.cnpg.io/v1"
kind: "Cluster"
metadata:
  name: "paperless-ngx-postgresql"
  namespace: "paperless-ngx"
spec:
  instances: 2
  storage:
    size: "32Gi"
    storageClass: "nfs-subdir-retain"
  bootstrap:
    initdb:
      database: "paperless"
      owner: "paperless"
      secret:
        name: "paperless-ngx-db-credentials"
...
